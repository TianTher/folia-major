name: Fork Build

# fork 自用：手动触发（或推到本分支）时，在这份代码上做一次真正的编译：
# 装依赖 → Dedicatus 架构检查 → 类型检查 → vite 生产构建。
# 只存在于 ci/fork-build 这个分支上，对上游提 PR 时不带这个文件。

on:
  workflow_dispatch:
  push:
    branches:
      - ci/fork-build

permissions:
  contents: read

jobs:
  build:
    name: Build web app
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Restore node_modules
        id: node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-ubuntu-latest-node24-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Dedicatus graph checks
        run: npm run dedicatus -- --no-base

      - name: Typecheck
        run: npm run typecheck

      - name: Build (vite production)
        run: npm run build

      - name: Build the bundled sources
        run: npm run sources:build

      - name: Report the build
        run: |
          echo "编译完成：`dist/` $(find dist -type f | wc -l) 个文件" >> "$GITHUB_STEP_SUMMARY"
          du -sh dist >> "$GITHUB_STEP_SUMMARY"
